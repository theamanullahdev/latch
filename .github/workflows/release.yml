name: Release

# Push a tag like v0.2.0 (it must match the version in Cargo.toml).
# Builds the .deb, makes a GitHub Release, and updates the signed apt repo on gh-pages.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tag must match the crate version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION"
            exit 1
          fi
      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libglib2.0-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deb
      - name: Build release binaries (stripped by the release profile)
        run: cargo build --release --workspace
      - name: Package .deb and checksums
        run: |
          mkdir dist
          cargo deb -p latch-app --no-build --output dist/
          (cd dist && sha256sum ./*.deb > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          # Notes = the matching section of CHANGELOG.md.
          awk -v v="$VERSION" '$0 ~ "^## \\[" v "\\]" {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release $VERSION" > notes.md
          flags=()
          case "$VERSION" in 0.*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Latch $VERSION" --notes-file notes.md --verify-tag "${flags[@]}"

  apt-repo:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: apt-repo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Import the repository signing key
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
        run: |
          if [ -z "$APT_GPG_PRIVATE_KEY" ]; then
            echo "::error::secret APT_GPG_PRIVATE_KEY is not set"
            exit 1
          fi
          sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg
          printf '%s\n' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Update the apt repo on gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site && cd site
          git init -q -b gh-pages
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin gh-pages; then git reset -q --hard FETCH_HEAD; fi
          bash "$GITHUB_WORKSPACE/extras/scripts/apt-repo.sh" . "$GITHUB_WORKSPACE"/dist/*.deb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "apt repo: latch ${GITHUB_REF_NAME#v}"
          git push -q origin gh-pages
